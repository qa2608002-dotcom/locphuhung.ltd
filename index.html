<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý - Công ty TNHH Đầu tư và Phát triển Lộc Phú Hưng</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/8Q3Q3Q3.png"> <!-- Hoặc link logo của công ty -->
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #15803d;
            z-index: 999;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #bbf7d0;
            border-top: 4px solid #15803d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: 600; font-size: 14px;">Đang kết nối hệ thống Lộc Phú Hưng...</p>
    </div>

    <!-- Tự động nhúng trực tiếp Web App Google Apps Script vào trang -->
    <iframe src="https://script.google.com/macros/s/AKfycbwk9avFCssSNykolJtKF402Om5pjwQvfchjGekOIZ_g-tcTSv4e_l2bQipa4mbjMD5p/exec" onload="document.getElementById('loading').style.display='none';"></iframe>

</body>
</html>
